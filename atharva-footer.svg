<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-labelledby="footerTitle">
  <title id="footerTitle">Burgundy technical footer ornament</title>
  <defs>
    <linearGradient id="atharvaFooterLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#451126" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#451126" stop-opacity=".2"/>
      <animate attributeName="x1" values="0;1;0" dur="10s" repeatCount="indefinite"/>
