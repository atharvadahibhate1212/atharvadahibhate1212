  </defs>
  <rect width="1200" height="90" rx="12" fill="#10070C"/>
  <path d="M40 45H520 M680 45H1160" stroke="url(#atharvaFooterLine)" stroke-width="1.5"/>
  <g fill="none" stroke="#C77B9B" stroke-opacity=".8">
